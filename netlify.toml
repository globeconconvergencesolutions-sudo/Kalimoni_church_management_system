# St. Theresa Parish — Netlify deployment
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routes (React Router) — without this, /donate and other paths show Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (light touch; does not block SPA routing)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
